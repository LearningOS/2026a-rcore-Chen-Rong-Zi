# RustSBI-QEMU 0.1.0 build record — the TRUE stable rustsbi 0.2.0 bootloader.
# Built from rustsbi-qemu @ v0.1.0, which depends on the stable rustsbi library 0.2.0
# (boot banner reports "RustSBI version 0.2.0"; no alpha anywhere).
# Jump mode preserves os/Makefile's loader address (kernel at 0x80200000).
#
# Local patches on top of the v0.1.0 source (all needed to build/boot on a modern
# toolchain and QEMU; none change runtime SBI behavior):
#   - rustsbi 0.2.0 lib (privileged.rs): `in("a0")`/`in("a1")` -> `in("x10")`/`in("x11")`
#     (the old register aliases are rejected by modern rustc/LLVM).
#   - rustsbi-qemu wrapper:
#       * `generator_trait` feature + `Generator`/`GeneratorState` -> `coroutine_trait`
#         + `Coroutine`/`CoroutineState` (renamed in the 2024 nightly).
#       * drop now-stable `asm_sym` and `default_alloc_error_handler` features.
#       * disable `print_pmp()`: its jump-table inline asm traps/loops on QEMU 11
#         (diagnostic only — the PMP config is still applied by set_pmp()).
project = "RustSBI-QEMU"
rustsbi_version = "0.2.0"
repository = "https://github.com/rustsbi/rustsbi-qemu"
tag = "v0.1.0"
revision = "9d3299ccd1cf5d69b6926363ecb9a00dd07b3734"
toolchain = "nightly-2024-05-02"
target = "riscv64imac-unknown-none-elf"
dependency_lock = "rustsbi-Cargo.lock"
dependency_lock_sha256 = "200d5f7d1718db9c9b3da03d6db6787140bb4b84b0f2c61da606ad0a59b199f6"
build_command = "cargo +nightly-2024-05-02 build --release --target riscv64imac-unknown-none-elf (with [patch.crates-io] rustsbi -> patched rustsbi-0.2.0)"
build_output = "target/riscv64imac-unknown-none-elf/release/rustsbi-qemu.bin"
mode = "jump"
firmware_address = 0x80000000
kernel_address = 0x80200000
sha256 = "2762f04487a8d0998fb9f4261c9ce86369c574f90e5f4e84234a1626a66e5104"
license = "MulanPSL-2.0 OR MIT"
license_file = "LICENSE-RustSBI"
